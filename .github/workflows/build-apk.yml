name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        run: bash android/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-apk
          path: PULSE.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 PULSE.apk \
            --title "PULSE v1.0.0 (Android APK)" \
            --notes "Installable Android build of PULSE. Sideload it: download the APK, allow install from this source, then open it." \
          || gh release upload v1.0.0 PULSE.apk --clobber
